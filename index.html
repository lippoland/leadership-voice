<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#240D08">
<title>Leadership Voice · LippoLand</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  /* LippoLand palette (exec-deck): mahogany 60261C · mahogany dark 3D170F · orange F95A44 · cream FBF7EC */
  --navy:#3D170F; --bg:#240D08; --char:#4D1E16; --mahog:#60261C;
  --gold:#F95A44; --goldbg:#F95A44; --gold2:#FF9C86; --white:#FBF7EC; --mute:#CDB8AA;
  --line:rgba(249,90,68,.28); --line2:rgba(212,196,180,.16);
  --serif:"Cormorant Garamond",Georgia,"Times New Roman",serif;
  --sans:"Manrope",Arial,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--white);font-family:var(--sans);-webkit-font-smoothing:antialiased;overflow:hidden;line-height:1.45}
button{font-family:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.hidden{display:none!important}
.bgfx{position:fixed;inset:0;z-index:0;pointer-events:none;
  background:
   radial-gradient(1100px 700px at 12% -10%,rgba(61,23,15,.95),transparent 60%),
   radial-gradient(900px 700px at 100% 110%,rgba(249,90,68,.10),transparent 60%),
   radial-gradient(800px 600px at 80% 0%,rgba(77,30,22,.9),transparent 65%),
   var(--bg)}
#sparks{position:fixed;inset:0;z-index:0;pointer-events:none;opacity:.7}
.layer{position:relative;z-index:1;height:100%}
.serif{font-family:var(--serif)}
.gold{color:var(--gold)}
.mute{color:var(--mute)}
.kicker{font-size:clamp(11px,.95vw,15px);letter-spacing:.34em;text-transform:uppercase;color:var(--gold);font-weight:600}
.rule{width:72px;height:1px;background:linear-gradient(90deg,transparent,var(--gold),transparent);margin:clamp(14px,2.4vh,30px) auto}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:10px 14px;border-radius:999px;border:1px solid var(--line2);
  font-size:11.5px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--white);background:rgba(77,30,22,.7);transition:.2s;white-space:nowrap}
.btn:hover{border-color:var(--gold);color:var(--gold2)}
.btn:disabled{opacity:.32;cursor:not-allowed;border-color:var(--line2);color:var(--white)}
.btn.gold{background:var(--goldbg);color:#2B100A;border-color:var(--goldbg)}
.btn.gold:hover{background:var(--gold2);border-color:var(--gold2);color:#2B100A}
.btn.ghost{background:transparent}
.btn.danger:hover{border-color:#F2B544;color:#F6D27A}
.btn.on{border-color:var(--gold);color:var(--gold)}
.btn.big{padding:18px 44px;font-size:clamp(13px,1.1vw,17px);letter-spacing:.3em}

/* ---------- opening ---------- */
.opening{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:5vh 6vw}
.opening h1{font-family:var(--serif);font-weight:500;font-size:clamp(46px,9.2vw,168px);letter-spacing:.12em;line-height:1;
  background:linear-gradient(180deg,#FBF7EC 30%,#F7B9A8 100%);-webkit-background-clip:text;background-clip:text;color:transparent;animation:rise 1.4s .15s both}
.opening .sub{margin-top:2.2vh;font-size:clamp(12px,1.25vw,22px);letter-spacing:.38em;text-transform:uppercase;color:var(--gold);animation:rise 1.4s .45s both}
.opening .q1{font-family:var(--serif);font-style:italic;font-size:clamp(24px,3.1vw,56px);animation:rise 1.4s .8s both}
.opening .q2{margin-top:1.2vh;color:var(--mute);font-size:clamp(14px,1.45vw,26px);animation:rise 1.4s 1.05s both}
.opening .go{margin-top:5.5vh;animation:rise 1.4s 1.35s both}
.opening .links{margin-top:3vh;display:flex;gap:26px;animation:rise 1.4s 1.6s both}
.link{font-size:11.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--mute);border-bottom:1px solid transparent;padding-bottom:3px}
.link:hover{color:var(--gold);border-color:var(--gold)}
@keyframes rise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}

/* ---------- host shell ---------- */
.host{height:100%;display:grid;grid-template-rows:auto 1fr auto}
.top{display:flex;align-items:center;gap:18px;padding:10px 22px;border-bottom:1px solid var(--line2);background:rgba(36,13,8,.72);backdrop-filter:blur(10px);transition:opacity .5s}
.brand{font-family:var(--serif);font-size:20px;letter-spacing:.2em;white-space:nowrap}
.brand b{color:var(--gold);font-weight:500}
.nav{display:flex;gap:0;flex:1;justify-content:center;flex-wrap:nowrap;min-width:0}
.nav button{padding:9px 10px;font-size:10.5px;font-weight:700;letter-spacing:.12em;white-space:nowrap;color:var(--mute);border-bottom:2px solid transparent;transition:.2s}
.nav button:hover{color:var(--white)}
.nav button.act{color:var(--gold);border-color:var(--gold)}
.chips{display:flex;gap:8px;align-items:center}
.chip{display:inline-flex;align-items:center;gap:7px;padding:6px 11px;border-radius:999px;border:1px solid var(--line2);font-size:10.5px;font-weight:700;letter-spacing:.13em;text-transform:uppercase;color:var(--mute);white-space:nowrap}
.chip b{color:var(--white);font-weight:700}
.chip.demo{border-color:var(--gold);color:var(--gold);background:rgba(249,90,68,.1)}
.chip.live{border-color:rgba(122,201,150,.5);color:#9ad9b1}
.chip.warn{border-color:rgba(242,181,68,.5);color:#F6D27A}
.dot{width:8px;height:8px;border-radius:50%;background:currentColor}
.dot.pulse{animation:pulse 1.6s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(249,90,68,.6)}100%{box-shadow:0 0 0 10px rgba(249,90,68,0)}}
.stage{position:relative;overflow:hidden;min-height:0}
.view{position:absolute;inset:0;padding:clamp(18px,3.2vh,44px) clamp(22px,4vw,72px);animation:fade .6s both;display:flex;flex-direction:column;min-height:0}
.ctrl{display:flex;align-items:center;gap:8px;padding:10px 18px;border-top:1px solid var(--line2);background:rgba(36,13,8,.8);backdrop-filter:blur(10px);flex-wrap:wrap;transition:opacity .5s}
.ctrl .sep{width:1px;height:26px;background:var(--line2);margin:0 4px}
.ctrl .grow{flex:1}
.qpill{padding:8px 14px;border-radius:999px;background:var(--char);font-size:11px;font-weight:700;letter-spacing:.14em;color:var(--mute);white-space:nowrap}
.qpill b{color:var(--gold)}
body.idle .top,body.idle .ctrl{opacity:0}
body.idle{cursor:none}
.wm{position:absolute;right:18px;top:12px;z-index:5;font-size:10.5px;letter-spacing:.24em;color:var(--gold);border:1px solid var(--gold);padding:5px 10px;border-radius:4px;background:rgba(36,13,8,.7);font-weight:700}

/* ---------- view head ---------- */
.vhead{display:flex;align-items:flex-end;justify-content:space-between;gap:24px;margin-bottom:clamp(12px,2.2vh,28px);flex:none}
.vhead h2{font-family:var(--serif);font-weight:500;font-size:clamp(22px,2.9vw,52px);letter-spacing:.06em;line-height:1.1}
.vhead .qline{color:var(--mute);font-size:clamp(12px,1.05vw,18px);margin-top:6px;font-style:italic;max-width:70vw}
.count{text-align:right;white-space:nowrap}
.count .n{font-family:var(--serif);font-size:clamp(34px,4vw,72px);color:var(--gold);line-height:.9}
.count .l{font-size:10.5px;letter-spacing:.24em;color:var(--mute);text-transform:uppercase}
.foot{flex:none;margin-top:10px;font-size:clamp(10px,.8vw,13px);letter-spacing:.08em;color:var(--mute);opacity:.85}
.empty{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;color:var(--mute);gap:14px}
.empty .t{font-family:var(--serif);font-size:clamp(24px,2.6vw,44px);color:var(--white);font-style:italic}

/* ---------- question view ---------- */
.qv{flex:1;display:grid;grid-template-columns:1.45fr .85fr;gap:clamp(24px,4vw,80px);align-items:center;min-height:0}
.qv .main h1{font-family:var(--serif);font-weight:500;font-size:clamp(28px,4.1vw,78px);line-height:1.12;margin:clamp(10px,2vh,26px) 0}
.qv .main .ptitle{font-size:clamp(12px,1.1vw,19px);letter-spacing:.3em;color:var(--mute);text-transform:uppercase;margin-top:10px}
.qv .main .sup{font-size:clamp(14px,1.45vw,26px);color:var(--mute);max-width:46ch}
.qv .stat{display:flex;align-items:center;gap:26px;margin-top:clamp(16px,3.4vh,44px)}
.qv .stat .n{font-family:var(--serif);font-size:clamp(44px,5.4vw,104px);color:var(--gold);line-height:.85}
.qv .stat .l{font-size:11px;letter-spacing:.24em;color:var(--mute);text-transform:uppercase}
.status{display:inline-flex;align-items:center;gap:9px;padding:8px 14px;border-radius:999px;border:1px solid var(--line2);font-size:11px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:var(--mute)}
.status.open{border-color:var(--gold);color:var(--gold)}
.lobbyq{font-family:var(--serif);font-style:italic;font-size:clamp(24px,3vw,56px);line-height:1.2;margin-top:2vh}
.lobbyh{font-family:var(--serif);font-weight:500;font-size:clamp(34px,5vw,96px);letter-spacing:.12em;line-height:1}
.qr{background:linear-gradient(180deg,rgba(77,30,22,.85),rgba(61,23,15,.85));border:1px solid var(--line);border-radius:22px;padding:clamp(16px,2.4vh,30px);text-align:center;max-height:100%;display:flex;flex-direction:column;align-items:center}
.qr .t{font-size:clamp(11px,1vw,16px);letter-spacing:.3em;color:var(--gold);font-weight:700}
.qr .s{font-size:clamp(11px,.95vw,15px);color:var(--mute);margin:6px 0 clamp(10px,1.8vh,20px)}
.qr .code{background:#fff;border-radius:14px;padding:clamp(8px,1.2vh,14px);width:min(100%,46vh);aspect-ratio:1}
.qr .code svg{display:block;width:100%;height:100%}
.qr .url{margin:clamp(10px,1.6vh,18px) 0 10px;font-size:clamp(11px,.9vw,15px);color:var(--white);word-break:break-all;max-width:100%;font-family:ui-monospace,Menlo,Consolas,monospace;opacity:.9}
.qr .warn{margin-top:10px;font-size:11.5px;color:#F6D27A;max-width:36ch}

/* ---------- live wall ---------- */
.wall{flex:1;display:grid;gap:clamp(10px,1.4vw,22px);align-content:start;min-height:0;overflow:hidden;grid-auto-rows:1fr}
.card{background:linear-gradient(160deg,rgba(77,30,22,.92),rgba(61,23,15,.92));border:1px solid var(--line2);border-radius:16px;padding:clamp(12px,1.5vw,24px);
  font-size:clamp(14px,1.45vw,26px);line-height:1.32;display:flex;align-items:center;position:relative;overflow:hidden;min-height:0;overflow-wrap:anywhere;
  transition:border-color 1.6s,box-shadow 1.6s}
.card::before{content:"";position:absolute;left:0;top:18%;bottom:18%;width:2px;background:var(--gold);opacity:.55}
.card.long{font-size:clamp(12px,1.15vw,21px)}
.card.xlong{font-size:clamp(11px,.98vw,18px)}
.wall .card{animation:pop .8s cubic-bezier(.2,.8,.2,1) both, drift var(--d,9s) ease-in-out var(--dl,0s) infinite alternate}
.card.fresh{border-color:var(--gold);box-shadow:0 0 0 1px rgba(249,90,68,.4),0 14px 50px rgba(249,90,68,.16)}
@keyframes pop{from{opacity:0;transform:translateY(22px) scale(.96)}to{opacity:1;transform:none}}
@keyframes drift{from{translate:0 -3px}to{translate:0 4px}}
.wallmsg{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(36,13,8,.9);z-index:3;flex-direction:column;gap:12px}
.frozen{color:var(--gold);font-size:11px;letter-spacing:.22em;font-weight:700}

/* ---------- all responses ---------- */
.all{flex:1;overflow:auto;display:grid;gap:12px;align-content:start;grid-auto-rows:max-content;grid-template-columns:repeat(auto-fill,minmax(var(--min,300px),1fr));padding-right:6px;min-height:0}
.all .card{overflow:visible;min-height:auto;font-size:var(--fs,17px);padding:14px 18px;animation:fade .5s both;align-items:flex-start;flex-direction:column;gap:6px}
.all .card.spec{border-color:var(--line)}
.tag{font-size:9.5px;letter-spacing:.2em;color:var(--gold);font-weight:700}
.all::-webkit-scrollbar,.scroll::-webkit-scrollbar{width:8px}
.all::-webkit-scrollbar-thumb,.scroll::-webkit-scrollbar-thumb{background:var(--char);border-radius:8px}

/* ---------- word cloud ---------- */
.cloud{flex:1;position:relative;min-height:0}
.cloud span{position:absolute;white-space:nowrap;font-weight:700;letter-spacing:.02em;line-height:1;text-transform:uppercase;
  transition:left 1.1s cubic-bezier(.2,.8,.2,1),top 1.1s cubic-bezier(.2,.8,.2,1),font-size 1.1s cubic-bezier(.2,.8,.2,1),opacity .9s,color .9s;opacity:0}

/* ---------- top 5 ---------- */
.t5{flex:1;display:flex;flex-direction:column;justify-content:center;gap:clamp(8px,1.6vh,22px);min-height:0}
.t5row{display:grid;grid-template-columns:clamp(54px,6vw,120px) 1fr clamp(90px,9vw,170px);align-items:center;gap:clamp(12px,2vw,36px);opacity:.25;transition:opacity .6s}
.t5row.has{opacity:1}
.t5row .rk{font-family:var(--serif);font-size:clamp(34px,4.6vw,88px);color:var(--gold);line-height:.9}
.t5row:nth-child(n+2) .rk{color:rgba(249,90,68,.62)}
.t5row .nm{font-size:clamp(15px,1.75vw,32px);font-weight:700;letter-spacing:.12em}
.t5row .ds{font-size:clamp(11px,1vw,18px);color:var(--mute);margin:2px 0 8px}
.bar{height:clamp(5px,.8vh,10px);background:rgba(212,196,180,.12);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#B8402F,var(--gold),var(--gold2));border-radius:99px;transition:width 1.2s cubic-bezier(.2,.8,.2,1)}
.t5row .pc{text-align:right;font-family:var(--serif);font-size:clamp(30px,3.8vw,74px);line-height:.9}
.t5row .ct{text-align:right;font-size:clamp(10px,.82vw,14px);letter-spacing:.16em;color:var(--mute);text-transform:uppercase;margin-top:4px}

/* ---------- insights ---------- */
.ins{flex:1;display:grid;grid-template-columns:1.15fr 1fr;grid-template-rows:1fr auto;gap:clamp(12px,1.6vw,26px);min-height:0}
.panel{background:linear-gradient(160deg,rgba(77,30,22,.8),rgba(61,23,15,.8));border:1px solid var(--line2);border-radius:18px;padding:clamp(12px,1.4vw,24px);min-height:0;overflow:hidden}
.panel h3{font-size:clamp(10.5px,.9vw,15px);letter-spacing:.3em;color:var(--gold);font-weight:700;margin-bottom:clamp(8px,1.2vh,16px)}
.panel p.big{font-size:clamp(14px,1.25vw,23px);line-height:1.4}
.insv .qline{display:none}
.panel .voice{margin-top:clamp(8px,1.4vh,16px)}
.panel .voice h3{margin-bottom:4px}
.panel .voice q{display:block;font-family:var(--serif);font-style:italic;font-size:clamp(14px,1.3vw,24px);line-height:1.25;margin-top:3px}
.mrow{display:grid;grid-template-columns:1fr auto;gap:3px 16px;align-items:end;margin-bottom:clamp(5px,1.1vh,13px)}
.mrow .nm{font-size:clamp(12px,1.05vw,19px);font-weight:700;letter-spacing:.1em}
.mrow .pc{font-family:var(--serif);font-size:clamp(18px,1.7vw,30px);color:var(--gold);line-height:1}
.mrow .bar{grid-column:1/-1}
.dims{display:flex;gap:8px;flex-wrap:wrap;margin-top:clamp(8px,1.3vh,14px)}
.dim{display:flex;align-items:baseline;gap:7px;border:1px solid var(--line2);border-radius:99px;padding:5px 13px}
.dim .v{font-family:var(--serif);font-size:clamp(15px,1.35vw,24px);color:var(--white);line-height:1}
.dim .k{font-size:clamp(8.5px,.62vw,11px);letter-spacing:.16em;color:var(--mute);text-transform:uppercase}
.dim.top{border-color:var(--gold)}.dim.top .v{color:var(--gold)}
.refl{grid-column:1/-1;border:1px solid var(--line);border-radius:18px;padding:clamp(12px,1.8vh,26px) clamp(18px,2.6vw,48px);background:linear-gradient(90deg,rgba(249,90,68,.1),rgba(249,90,68,.02));text-align:center}
.refl h3{font-size:clamp(10.5px,.9vw,15px);letter-spacing:.3em;color:var(--gold);font-weight:700;margin-bottom:8px}
.refl p{font-family:var(--serif);font-size:clamp(18px,1.95vw,36px);line-height:1.2;font-style:italic}
.trans{margin-top:8px;font-size:clamp(11px,.95vw,16px);color:var(--mute);letter-spacing:.04em;font-style:normal;font-family:var(--sans)}

/* ---------- overview / settings ---------- */
.scroll{flex:1;overflow:auto;min-height:0;padding-right:8px}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:16px}
.kpi{border:1px solid var(--line2);background:rgba(77,30,22,.6);border-radius:16px;padding:16px 20px}
.kpi .v{font-family:var(--serif);font-size:clamp(30px,3.2vw,56px);color:var(--gold);line-height:1}
.kpi .k{font-size:10.5px;letter-spacing:.22em;color:var(--mute);text-transform:uppercase;margin-top:6px}
.kpi .x{font-size:11.5px;color:var(--mute);margin-top:4px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:16px}
.box{border:1px solid var(--line2);background:rgba(77,30,22,.6);border-radius:16px;padding:18px 20px}
.box h4{font-size:11px;letter-spacing:.24em;color:var(--gold);font-weight:700;margin-bottom:10px;text-transform:uppercase}
.box .qq{font-family:var(--serif);font-size:19px;line-height:1.25;margin-bottom:10px}
.box .li{display:flex;justify-content:space-between;gap:10px;font-size:13px;padding:5px 0;border-bottom:1px solid var(--line2)}
.box .li span:last-child{color:var(--gold);font-weight:700}
.box p{font-size:13.5px;color:var(--mute);margin:8px 0}
.box p b,.box li b{color:var(--white)}
.words{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.words span{font-size:11px;padding:4px 9px;border-radius:99px;border:1px solid var(--line2);letter-spacing:.08em;text-transform:uppercase}
.words span b{color:var(--gold);margin-left:5px}
.rowbtn{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:16px}
.field{margin:10px 0}
.field label{display:block;font-size:10.5px;letter-spacing:.2em;color:var(--mute);text-transform:uppercase;margin-bottom:6px}
.field input{width:100%;padding:11px 14px;border-radius:10px;border:1px solid var(--line2);background:rgba(36,13,8,.7);color:#fff;font:inherit;font-size:14px}
.box ol,.box ul{margin:8px 0 8px 18px;font-size:13.5px;color:var(--mute)}
.box li{margin:4px 0}
.box code,kbd{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;background:rgba(36,13,8,.8);border:1px solid var(--line2);border-radius:5px;padding:1px 6px;color:var(--gold2)}
.box pre{background:rgba(36,13,8,.85);border:1px solid var(--line2);border-radius:10px;padding:12px;font-size:11.5px;overflow:auto;color:var(--gold2);margin:8px 0;font-family:ui-monospace,Menlo,Consolas,monospace}
.note{font-size:12.5px;border-left:2px solid var(--gold);padding:6px 12px;color:var(--mute);margin:10px 0;background:rgba(249,90,68,.05)}
.note.bad{border-color:#F2B544;color:#F6D27A}.note.ok{border-color:#7ac996;color:#9ad9b1}

/* ---------- closing ---------- */
.closing{align-items:center;justify-content:center;text-align:center}
.closing .ttl{font-size:clamp(13px,1.5vw,26px);letter-spacing:.5em;color:var(--gold);font-weight:600;animation:rise 1.6s .2s both}
.closing .st{font-family:var(--serif);font-size:clamp(24px,3.7vw,72px);line-height:1.22;margin-top:1vh}
.closing .st span{display:block;opacity:0;animation:rise 1.5s both}
.closing .st span:nth-child(1){animation-delay:.9s}.closing .st span:nth-child(2){animation-delay:1.9s}
.closing .st span:nth-child(3){animation-delay:2.8s}.closing .st span:nth-child(4){animation-delay:3.7s}
.closing .st em{color:var(--gold);font-style:italic}
.closing .sp{max-width:62ch;color:var(--mute);font-size:clamp(13px,1.3vw,24px);animation:rise 1.6s 5s both}
.closing .fin{margin-top:clamp(14px,3vh,40px);display:flex;gap:clamp(14px,3vw,60px);justify-content:center;flex-wrap:wrap;font-size:clamp(13px,1.5vw,28px);letter-spacing:.34em;font-weight:700}
.closing .fin span{opacity:0;animation:rise 1.4s both}
.closing .fin span:nth-child(1){animation-delay:6.2s}.closing .fin span:nth-child(2){animation-delay:6.9s;color:var(--gold)}.closing .fin span:nth-child(3){animation-delay:7.6s}

/* ---------- modal / toast ---------- */
.modal{position:fixed;inset:0;z-index:50;background:rgba(20,7,4,.78);display:flex;align-items:center;justify-content:center;padding:20px;animation:fade .2s both}
.modal .m{max-width:480px;width:100%;background:var(--navy);border:1px solid var(--line);border-radius:18px;padding:28px}
.modal h3{font-family:var(--serif);font-size:26px;font-weight:500;margin-bottom:8px}
.modal p{color:var(--mute);font-size:14px}
.modal .rowbtn{justify-content:flex-end;margin-top:22px}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);z-index:60;background:var(--gold);color:#2B100A;font-weight:700;font-size:12px;letter-spacing:.12em;padding:10px 18px;border-radius:99px;animation:rise .3s both;text-transform:uppercase}

/* ---------- participant ---------- */
.pt{height:100%;overflow:auto;display:flex;flex-direction:column;padding:max(22px,env(safe-area-inset-top)) 22px max(22px,env(safe-area-inset-bottom));max-width:560px;margin:0 auto}
.pt header{text-align:center;padding:8px 0 18px}
.pt header .b{font-family:var(--serif);font-size:24px;letter-spacing:.24em}
.pt header .m{font-family:var(--serif);font-style:italic;color:var(--gold);font-size:17px;margin-top:2px}
.pt main{flex:1;display:flex;flex-direction:column;justify-content:center;animation:rise .6s both}
.pt .prog{display:flex;gap:6px;margin:12px 0 20px}
.pt .prog i{flex:1;height:3px;border-radius:3px;background:rgba(212,196,180,.2)}
.pt .prog i.d{background:rgba(249,90,68,.5)}.pt .prog i.c{background:var(--gold)}
.pt .qn{font-size:11.5px;letter-spacing:.28em;color:var(--gold);font-weight:700}
.pt h1{font-family:var(--serif);font-weight:500;font-size:29px;line-height:1.2;margin-bottom:10px}
.pt .sup{color:var(--mute);font-size:15px;margin-bottom:20px}
.pt textarea{width:100%;min-height:150px;padding:16px;border-radius:14px;border:1px solid var(--line);background:rgba(77,30,22,.8);color:#fff;font:inherit;font-size:17px;line-height:1.4;resize:none}
.pt textarea::placeholder{color:rgba(212,196,180,.55)}
.pt .meta{display:flex;justify-content:space-between;font-size:12px;color:var(--mute);margin:8px 2px 18px}
.pt .btn.big{width:100%;padding:18px;font-size:14px}
.pt .center{text-align:center}
.pt .center h1{font-size:31px;margin-top:18px}
.pt .center p{color:var(--mute);font-size:16px;margin-top:10px}
.pt .ring{width:84px;height:84px;border-radius:50%;border:1px solid var(--gold);display:flex;align-items:center;justify-content:center;margin:0 auto;color:var(--gold);font-size:34px;animation:pop .8s both}
.pt .wait{display:inline-flex;gap:8px;align-items:center;margin-top:26px;font-size:11.5px;letter-spacing:.2em;color:var(--gold);text-transform:uppercase}
.pt footer{text-align:center;font-size:10.5px;letter-spacing:.14em;color:var(--mute);opacity:.7;padding-top:16px;text-transform:uppercase}
.pt .err{color:#F6D27A;font-size:13px;margin-top:10px;text-align:center}

@media (max-width:1720px){.chips .chip.opt2{display:none}}
@media (max-width:1480px){.brand{display:none}.nav{justify-content:flex-start}}
@media (max-width:1180px){.chips .chip.opt{display:none}}
@media (max-width:1100px){
  .nav{flex-wrap:wrap}.kpis{grid-template-columns:repeat(2,1fr)}.grid3,.grid2{grid-template-columns:1fr}
}
@media (max-width:820px){
  body{overflow:auto}
  .qv{grid-template-columns:1fr;overflow:auto;align-items:start}.ins{grid-template-columns:1fr;grid-template-rows:auto;overflow:auto}
  .chips .chip.opt{display:none}
}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01s!important;animation-delay:0s!important;transition-duration:.01s!important}}

q{quotes:none}q::before,q::after{content:none}
.stage.isdemo .view{padding-top:clamp(42px,5.4vh,60px)}
.wm{top:9px}
@media (max-width:1480px){.btn{padding:9px 11px;font-size:10.5px;letter-spacing:.09em}.btn.big{padding:16px 36px;font-size:13px;letter-spacing:.26em}.ctrl{gap:6px;padding:9px 12px}.qpill{padding:8px 10px;font-size:10.5px;letter-spacing:.09em}}


/* ---------- LippoLand additions ---------- */
.accentbar{position:fixed;left:0;right:0;top:0;height:calc(4px + env(safe-area-inset-top,0px));background:var(--goldbg);z-index:40;pointer-events:none}
.top{border-top:4px solid transparent}
.brandline{font-size:clamp(10px,.85vw,14px);letter-spacing:.34em;color:var(--mute);text-transform:uppercase;font-weight:700;margin-bottom:2.6vh;animation:rise 1.4s both}
.brandline b{color:var(--gold);font-weight:800}
.noqr{height:100%;display:flex;align-items:center;justify-content:center;text-align:center;color:#60261C;font-weight:700;font-size:15px;line-height:1.45;padding:14px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:13px;margin:10px 0}
.kv span:nth-child(odd){color:var(--mute);letter-spacing:.08em;text-transform:uppercase;font-size:11px;padding-top:2px}
.kv span:nth-child(even){color:var(--white);word-break:break-all;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12.5px}
/* participant phones: LippoLand cream content theme */
body.part{--bg:#FBF7EC;--navy:#FFFFFF;--char:#FFFFFF;--gold:#B93A27;--goldbg:#F95A44;--gold2:#FF7A63;--white:#2B2A29;--mute:#6B6461;--line:rgba(96,38,28,.28);--line2:#E0DBD0;color-scheme:light;background:var(--bg);color:var(--white)}
body.part .bgfx,body.part #sparks{display:none}
body.part .pt header .b,body.part .pt h1{color:#60261C}
body.part .pt header .m{color:var(--gold)}
.pt header .ev{font-size:10.5px;letter-spacing:.24em;color:var(--mute);text-transform:uppercase;font-weight:700;margin-top:10px}
body.part .pt textarea{background:#FFFFFF;color:#2B2A29;border-color:#E0DBD0}
body.part .pt textarea:focus{border-color:var(--goldbg);outline:none;box-shadow:0 0 0 3px rgba(249,90,68,.2)}
body.part .pt textarea::placeholder{color:#A09080}
body.part .pt .prog i{background:#E0DBD0}
body.part .pt .prog i.d{background:rgba(249,90,68,.45)}
body.part .pt .prog i.c{background:var(--goldbg)}
body.part .pt .err{color:#B3261E}
body.part .pt .ring{border-color:var(--goldbg);color:var(--gold)}
body.part .btn:disabled{color:#2B2A29}
</style>

/* ---------- word cloud layout (spiral placement, no overlap) ---------- */
let mctx = null;
function layoutCloud(box, words, sig) {
  const W = box.clientWidth, Ht = box.clientHeight; if (W < 80 || Ht < 80) return;
  const key = sig + '|' + W + 'x' + Ht; if (box.dataset.sig === key) return; box.dataset.sig = key;
  const list = words.slice(0, 44);
  if (!list.length) { box.innerHTML = `<div class="empty" style="height:100%"><div class="t">The word cloud will form as responses arrive</div></div>`; return; }
  const e = $('.empty', box); if (e) e.remove();
  mctx = mctx || document.createElement('canvas').getContext('2d');
  const fam = getComputedStyle(document.body).fontFamily, cmax = list[0].c, cmin = list[list.length - 1].c;
  let maxF = Math.max(30, Math.min(Ht * 0.21, W * 0.09)), placed = [];
  for (let attempt = 0; attempt < 6; attempt++) {
    const minF = Math.max(12, maxF * 0.17); placed = []; let miss = 0;
    list.forEach((w, i) => {
      const f = cmax === cmin ? Math.max(minF * 1.6, maxF * 0.3) : minF + (maxF - minF) * Math.pow((w.c - cmin) / (cmax - cmin), 0.8);
      mctx.font = `700 ${f}px ${fam}`; const tw = mctx.measureText(w.label).width + w.label.length * f * 0.02 + f * 0.5, th = f * 1.12;
      for (let t = 0; t < 2600; t++) {
        const a = t * 0.24, r = 1.5 * a, x = W / 2 + r * Math.cos(a) * (W / Ht) * 0.8 - tw / 2, y = Ht / 2 + r * Math.sin(a) * 0.8 - th / 2;
        if (x < 0 || y < 0 || x + tw > W || y + th > Ht) { if (r > Math.max(W, Ht)) break; continue; }
        if (placed.some(p => x < p.x + p.w && x + tw > p.x && y < p.y + p.h && y + th > p.y)) continue;
        placed.push({ word: w, i, x, y, w: tw, h: th, f }); return;
      }
      miss++;
    });
    if (!miss) break; maxF *= 0.86;
  }
  const colors = ['#FBF7EC', '#FF9C86', '#CDB8AA', '#FBF7EC', '#F95A44'], seen = new Set();
  const spans = {}; $$('span', box).forEach(s => spans[s.dataset.w] = s);
  placed.forEach(p => {
    const id = p.word.w; seen.add(id); let s = spans[id];
    if (!s) { s = document.createElement('span'); s.dataset.w = id; s.textContent = p.word.label; s.style.left = (W / 2) + 'px'; s.style.top = (Ht / 2) + 'px'; s.style.fontSize = '10px'; box.appendChild(s); s.getBoundingClientRect(); }
    s.style.left = (p.x + p.f * 0.25) + 'px'; s.style.top = (p.y + p.f * 0.06) + 'px'; s.style.fontSize = p.f + 'px';
    s.style.color = p.i < 3 ? '#F95A44' : colors[p.i % colors.length]; s.style.opacity = p.i < 3 ? 1 : Math.max(0.62, 1 - p.i * 0.012);
    s.title = p.word.c + ' response' + (p.word.c === 1 ? '' : 's');
  });
  Object.keys(spans).forEach(id => { if (!seen.has(id)) { spans[id].style.opacity = 0; setTimeout(() => spans[id].remove(), 900); } });
}

function bootHost() {
  buildHost(); connectReal();
  demoT.onChange = sched;
  document.addEventListener('click', e => { const b = e.target.closest('[data-act]'); if (b && !b.disabled && ACT[b.dataset.act]) ACT[b.dataset.act](b); });
  document.addEventListener('keydown', e => {
    if (/INPUT|TEXTAREA|SELECT/.test(e.target.tagName) || e.metaKey || e.ctrlKey || e.altKey) return;
    if (e.key === 'Escape') { $$('.modal').forEach(m => m.remove()); return; }
    if ($('.modal')) return;
    const k = e.key.toLowerCase();
    if (k === 'f') return ACT.fullscreen();
    if (!S().started) return;
    const map = { '0': 'overview', '1': 'question', '2': 'live', '3': 'all', '4': 'cloud', '5': 'top5', '6': 'insights' };
    if (map[k]) { H.view = map[k]; sched(); }
    else if (k === 'arrowright') ACT.next(); else if (k === 'arrowleft') ACT.prev();
    else if (k === 'a') { const s = S(); if (s.cur && s.q[curKey()].status !== 'open') ACT.activate(); }
    else if (k === 'p') { const s = S(); if (s.cur) { const x = s.q[curKey()].status; if (x === 'open') ACT.pause(); else if (x === 'paused') ACT.resume(); } }
    else if (k === ' ' && H.view === 'live') { e.preventDefault(); ACT.freeze(); }
  });
  let idleT; const wake = () => { document.body.classList.remove('idle'); clearTimeout(idleT); if (document.fullscreenElement && !['settings', 'overview'].includes(H.view)) idleT = setTimeout(() => document.body.classList.add('idle'), 3500); };
  ['mousemove', 'keydown', 'click', 'fullscreenchange'].forEach(ev => document.addEventListener(ev, wake));
  window.addEventListener('resize', sched);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { const c = $('#cloud'); if (c) c.dataset.sig = ''; sched(); });
  sched();
}

/* =====================================================================
   PARTICIPANT MODE (mobile)
   ===================================================================== */
const P = { pid: null, drafts: {}, mem: {}, err: '', sending: false, key: '', reg: '' };
const subKey = (k, ep) => 'lv:sub:' + (GAS ? 'gas' : 'local') + ':' + k + ':' + ep;
function isSubmitted(k, ep) {
  const own = T.tree.responses && T.tree.responses[k] && T.tree.responses[k][P.pid];
  if (own && own.t && own.ep === ep) return true;
  return !!(P.mem[subKey(k, ep)] || ls.get(subKey(k, ep), false));
}
function bootParticipant() {
  document.body.classList.add('part');
  P.pid = ls.get('lv:pid', null); if (!P.pid) { P.pid = 'p' + rid(14); ls.set('lv:pid', P.pid); }
  T = GAS ? new GasT('participant', '') : new LocalT('local');
  T.onChange = sched; T.onStatus = sched;
  app.innerHTML = `<div class="pt"><header><div class="b">LEADERSHIP VOICE</div><div class="m">Your voice matters.</div><div class="ev">LippoLand · Leadership Offsite 2026</div></header><main id="pMain"></main><footer id="pFoot"></footer></div>`;
  $('#pMain').addEventListener('input', e => { if (e.target.id === 'ans') { const k = e.target.dataset.k; P.drafts[k] = e.target.value; $('#cnt').textContent = e.target.value.length + ' / ' + CONFIG.maxChars; if (P.err) { P.err = ''; $('#pErr').textContent = ''; } } });
  $('#pMain').addEventListener('click', e => { if (e.target.closest('#send')) submitAnswer(); });
  sched();
}
async function submitAnswer() {
  const st = S(), q = QS[st.cur - 1]; if (!q || P.sending) return;
  const t = ($('#ans').value || '').replace(/\s+/g, ' ').trim().slice(0, CONFIG.maxChars);
  if (!t) { P.err = 'Please write your answer first.'; $('#pErr').textContent = P.err; return; }
  if (st.q[q.key].status !== 'open') return;
  P.sending = true; const btn = $('#send'); btn.disabled = true; btn.textContent = 'SENDING…';
  const ep = st.q[q.key].epoch;
  try {
    await T.update({ ['responses/' + q.key + '/' + P.pid]: { t, ts: Date.now(), ep } });
    const k = subKey(q.key, ep); P.mem[k] = true; ls.set(k, true); delete P.drafts[q.key]; P.err = '';
  } catch (e) {
    if (T.tree.responses && T.tree.responses[q.key]) delete T.tree.responses[q.key][P.pid];
    P.err = e && e.code === 'closed' ? 'This question is no longer open for answers.' : 'Your answer could not be sent. Check your internet connection and try again.';
  }
  P.sending = false; P.key = ''; sched();
}
function renderParticipant() {
  const st = S(), q = st.cur ? QS[st.cur - 1] : null, qs = q ? st.q[q.key] : null, live = T.kind === 'gas';
  const sub = q && isSubmitted(q.key, qs.epoch);
  let scr = live && !T._first ? (T.status === 'error' ? 'offline' : 'connecting') : st.closing ? 'closing' : (!st.started || !q || qs.status === 'idle') ? 'waiting' : sub ? 'thanks' : qs.status === 'open' ? 'form' : qs.status;
  if (st.started && (!live || T._first) && P.reg !== (st.sid || '-')) { P.reg = st.sid || '-'; Promise.resolve(T.update({ ['participants/' + P.pid]: { ts: Date.now(), sid: st.sid || '' } })).catch(() => { P.reg = ''; }); }
  $('#pFoot').textContent = live ? (T.status === 'live' ? 'Anonymous · no login · connected' : 'Reconnecting…') : 'Preview · this device only';
  const key = scr + '|' + st.cur + '|' + (qs ? qs.epoch : '') + '|' + P.err; if (key === P.key) return; P.key = key;
  const prog = q ? `<div class="qn">QUESTION ${q.no} OF 03</div><div class="prog" role="progressbar" aria-valuemin="1" aria-valuemax="3" aria-valuenow="${st.cur}">${[1, 2, 3].map(i => `<i class="${i < st.cur ? 'd' : i === st.cur ? 'c' : ''}"></i>`).join('')}</div>` : '';
  const wait = t => `<div class="wait"><i class="dot pulse"></i>${t}</div>`;
  const H2 = {
    connecting: () => `<div class="center"><p>Connecting to the session…</p></div>`,
    offline: () => `<div class="center"><h1 class="serif">We can’t reach the session</h1><p>Please check your internet connection. This page reconnects automatically.</p></div>`,
    waiting: () => `<div class="center"><div class="kicker">WELCOME</div><h1 class="serif">Share your perspective. Reflect honestly.</h1><p>Help us understand what leadership truly means.</p><p style="font-size:14px">Three short questions · anonymous · no login needed</p>${wait(q ? 'Question ' + q.no + ' will open shortly' : 'Waiting for the host to begin')}</div>`,
    form: () => `${prog}<h1>${esc(q.q)}</h1><div class="sup">${esc(q.sub)}</div>
      <textarea id="ans" data-k="${q.key}" maxlength="${CONFIG.maxChars}" placeholder="Tulis jawaban Anda di sini…" aria-label="Your answer">${esc(P.drafts[q.key] || '')}</textarea>
      <div class="meta"><span>Anonymous · one response per question</span><span id="cnt">${(P.drafts[q.key] || '').length} / ${CONFIG.maxChars}</span></div>
      <button class="btn gold big" id="send">SUBMIT</button><div class="err" id="pErr" role="alert">${esc(P.err)}</div>`,
    thanks: () => `<div class="center">${prog}<div class="ring">✓</div><h1 class="serif">Thank you for sharing your voice.</h1><p>Your response has been added to our collective reflection.</p>${st.cur < 3 ? wait('The next question will appear here') : '<p style="font-size:14px">This was the final question.</p>'}</div>`,
    paused: () => `<div class="center">${prog}<h1 class="serif">Responses are paused</h1><p>Please look at the main screen. ${P.drafts[q.key] ? 'Your draft is kept and will return if the question reopens.' : ''}</p></div>`,
    closed: () => `<div class="center">${prog}<h1 class="serif">This question is closed</h1><p>Thank you. Please follow the discussion on the main screen.</p>${st.cur < 3 ? wait('The next question will appear here') : ''}</div>`,
    closing: () => `<div class="center"><div class="kicker">LEADERSHIP IS A LEGACY</div><h1 class="serif" style="font-style:italic;line-height:1.3">“Leadership is not about the title we hold, but the people we develop, the trust we build, and the impact we leave behind.”</h1><p>Thank you for sharing your voice.</p></div>`
  };
  const main = $('#pMain'); main.innerHTML = H2[scr](); main.style.animation = 'none'; void main.offsetWidth; main.style.animation = '';
}

/* ---------- ambient gold particles ---------- */
(function sparks() {
  const c = $('#sparks'); if (!c || matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const x = c.getContext('2d'); if (!x) return; let W, Hh, ps = [];
  const size = () => { W = c.width = innerWidth; Hh = c.height = innerHeight; };
  size(); addEventListener('resize', size);
  for (let i = 0; i < 34; i++) ps.push({ x: Math.random(), y: Math.random(), r: 0.6 + Math.random() * 1.6, v: 0.00012 + Math.random() * 0.0003, a: 0.12 + Math.random() * 0.4, p: Math.random() * 6.28 });
  let last = 0; (function loop(t) {
    requestAnimationFrame(loop); if (t - last < 40 || document.hidden) return; last = t; x.clearRect(0, 0, W, Hh);
    ps.forEach(p => { p.y -= p.v * 2.5; if (p.y < -0.02) { p.y = 1.02; p.x = Math.random(); } x.globalAlpha = p.a * (0.6 + 0.4 * Math.sin(t / 1400 + p.p)); x.fillStyle = '#F95A44'; x.beginPath(); x.arc(p.x * W + Math.sin(t / 3000 + p.p) * 12, p.y * Hh, p.r, 0, 6.3); x.fill(); });
  })(0);
})();

{
  const p = new URLSearchParams(location.search);
  if (GAS) { ROLE = p.get('view') === 'host' ? 'host' : 'participant'; HOSTKEY = String(p.get('key') || ''); }
  else ROLE = /^#join$/i.test(location.hash) ? 'participant' : 'host';
  if (ROLE === 'host') bootHost(); else bootParticipant();
}
